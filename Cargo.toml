[package]
name = "onionmint"
version = "0.2.0"
edition = "2024"
description = "Vanity address generator for Tor v3 onion services"
license = "MIT"
repository = "https://github.com/rizl123/onionmint"
readme = "README.md"

[[bin]]
name = "onionmint"
path = "src/main.rs"

[[bench]]
name = "search"
harness = false

[dependencies]
curve25519-dalek = { version = "4", features = ["precomputed-tables"] }
getrandom = "0.2"
sha2 = "0.10"
sha3 = "0.10"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
signal-hook = "0.3"
argon2 = "0.5"
