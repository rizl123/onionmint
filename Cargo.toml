[package]
name = "onionmint"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "onionmint"
path = "src/main.rs"

[dependencies]
curve25519-dalek = { version = "4", features = ["precomputed-tables"] }
getrandom = "0.2"
sha2 = "0.10"
sha3 = "0.10"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
